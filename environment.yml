name: Seq2026
channels:
  - conda-forge
  - defaults

dependencies:
  # Core runtime. Python 3.11 is a safer portability target for the IBL stack
  # than a newest-possible interpreter pin.
  - python=3.11
  - pip

  # Core scientific stack
  - numpy>=1.26,<3
  - pandas>=2.2,<3
  - scipy>=1.12,<2
  - matplotlib>=3.8,<4
  - seaborn>=0.13,<0.14
  - scikit-learn>=1.5,<2
  - scikit-image>=0.24,<1
  - statsmodels>=0.14,<1
  - numba>=0.60,<1
  - h5py>=3.10,<4
  - pyarrow>=18,<100
  - pillow>=10,<13

  # Interactive work / dashboards
  - jupyterlab>=4,<5
  - ipykernel>=6,<7
  - plotly>=5.24,<7
  - streamlit>=1.39,<2
  - tqdm>=4.66,<5

  # General utilities
  - requests>=2.31,<3
  - pyyaml>=6,<7
  - pyqt>=5.15,<6

  - pip:
      # IBL / ONE ecosystem
      - one-api>=3,<4
      - ibllib>=3,<4
      - brainbox==0.0.9
      - iblatlas>=0.10,<0.11
      - iblutil>=1.20,<2
      - ibl-neuropixel>=1.9,<2
      - iblqt>=0.8,<0.9
      - ibl-style>=0.1,<0.2

      # Project analysis helpers
      - boto3>=1.35,<2
      - globus-sdk>=3,<5
      - imageio>=2.35,<3
      - mtscomp>=1,<2
      - nptdms>=1.10,<2
      - opencv-python-headless>=4.10,<5
      - psychofit==1.0.0.post0
      - pynrrd>=1.1,<2
      - pyqtgraph>=0.13,<0.15
      - slidingrp>=1.1,<2

      # Modeling / advanced analysis scripts
      - fastprogress>=1,<2
      - kornia>=0.7,<1
      - nemos>=0.2
      - torch>=2.4,<3
      - torchvision>=0.19,<1

      # Dev / maintenance
      - flake8>=7,<8
      - pytest>=8,<10
      - ruff>=0.6,<1

      # Optional for notebook 22. That notebook can also install it itself.
      # - git+https://github.com/lindermanlab/ppseq-pytorch.git@main
