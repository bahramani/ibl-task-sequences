<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuron Dashboard (Fast)</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  </head>
  <body>
    <header>
      <h1>Neuron Session Dashboard (Fast)</h1>
    </header>

    <section class="controls">
      <div class="control-row">
        <label for="pidSelect">PID</label>
        <select id="pidSelect"></select>
      </div>
      <div class="control-row">
        <label>
          <input type="checkbox" id="plotOnlyGood" />
          Plot only good neurons
        </label>
      </div>
      <div class="control-row">
        <label>Variability</label>
        <select id="variabilitySelect">
          <option value="fano">Fano Factor</option>
          <option value="cv">CV</option>
        </select>
      </div>
    </section>

    <section>
      <h2>Session Info</h2>
      <table id="sessionInfo"></table>
    </section>

    <section>
      <h2>Region Table</h2>
      <table id="regionTable"></table>
    </section>

    <section>
      <h2>General Raster</h2>
      <div class="control-row">
        <label>Start</label>
        <input type="number" id="generalStart" step="0.1" />
        <label>End</label>
        <input type="number" id="generalEnd" step="0.1" />
        <label>Shift (s)</label>
        <input type="number" id="generalShift" value="1" step="0.5" />
        <button id="generalShiftBtn">Shift +</button>
      </div>
      <div class="control-row">
        <label>Sort</label>
        <select id="generalSort">
          <option value="depth">Default (Depth)</option>
          <option value="stim">Delay to Stim</option>
          <option value="feedback">Delay to Feedback</option>
          <option value="move">Delay to Move</option>
          <option value="spont">Coupling Spont</option>
          <option value="task">Coupling Task</option>
        </select>
        <button id="generalUpdate">Update</button>
      </div>
      <div id="generalRaster" class="plot"></div>
    </section>

    <section>
      <h2>Trial Inspector</h2>
      <div class="control-row">
        <label>Trial</label>
        <select id="trialSelect"></select>
        <label>Sort</label>
        <select id="trialSort">
          <option value="depth">Default (Depth)</option>
          <option value="stim">Delay to Stim</option>
          <option value="feedback">Delay to Feedback</option>
          <option value="move">Delay to Move</option>
          <option value="spont">Coupling Spont</option>
          <option value="task">Coupling Task</option>
        </select>
        <button id="trialUpdate">Update</button>
      </div>
      <div id="trialRaster" class="plot"></div>
    </section>

    <section>
      <h2>Population Analysis</h2>
      <div class="control-row">
        <label>Sort</label>
        <select id="populationSort">
          <option value="delay">Own event delays</option>
          <option value="spont">Coupling Spont</option>
          <option value="task">Coupling Task</option>
          <option value="depth">Default</option>
        </select>
        <button id="populationUpdate">Update</button>
      </div>
      <div class="plot-grid">
        <div id="popPlot1" class="plot"></div>
        <div id="popPlot2" class="plot"></div>
        <div id="popPlot3" class="plot"></div>
      </div>
    </section>

    <section>
      <h2>Coupling</h2>
      <div class="plot-grid">
        <div id="couplingSpont" class="plot"></div>
        <div id="couplingTask" class="plot"></div>
      </div>
    </section>

    <section>
      <h2>stPR Comparison</h2>
      <div class="plot-grid">
        <div id="stprStrength" class="plot"></div>
        <div id="stprDelay" class="plot"></div>
      </div>
    </section>

    <section>
      <h2>Single Neuron</h2>
      <div class="control-row">
        <label>Neuron</label>
        <select id="neuronSelect"></select>
      </div>
      <div class="info-row" id="neuronInfo"></div>
      <div id="singleStim" class="plot"></div>
      <div id="singleMove" class="plot"></div>
      <div id="singleFeedback" class="plot"></div>
      <div class="plot-grid">
        <div id="stprTaskCurve" class="plot"></div>
        <div id="stprSpontCurve" class="plot"></div>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
